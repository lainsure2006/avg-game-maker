:root{

  --green:#3fb950; --red:#f85149; --amber:#d29922; --blue:#388bfd;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;line-height:1.5}
header{padding:18px 22px;border-bottom:1px solid var(--border);background:linear-gradient(180deg,#14171e,#0f1115)}
header h1{margin:0;font-size:20px;font-weight:700}
header .sub{color:var(--muted);font-size:12px;margin-top:4px}
.tabs{display:flex;gap:4px;padding:10px 18px 0;border-bottom:1px solid var(--border);background:var(--panel)}
.tab{padding:9px 16px;cursor:pointer;border:1px solid transparent;border-bottom:none;border-radius:8px 8px 0 0;color:var(--muted);font-weight:600}
.tab.active{background:var(--panel2);color:var(--text);border-color:var(--border)}
.tab .badge{margin-left:6px;font-size:11px;background:#2a2f3a;color:var(--muted);padding:1px 7px;border-radius:10px}
.tab .badge.warn{background:rgba(210,153,34,.18);color:var(--amber)}
main{padding:18px 22px;max-width:1280px;margin:0 auto}
.hidden{display:none}
/* overview */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:20px}
.stat{background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:16px}
.stat h3{margin:0 0 6px;font-size:13px;color:var(--muted);font-weight:600}
.stat .big{font-size:30px;font-weight:800}
.stat .bar{height:8px;background:#0c0e13;border-radius:6px;margin-top:10px;overflow:hidden}
.stat .bar>i{display:block;height:100%;background:linear-gradient(90deg,#3fb950,#6ea8fe)}
.stat .note{font-size:12px;color:var(--muted);margin-top:6px}
.lists{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:760px){.lists{grid-template-columns:1fr}}
.box{background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:14px}
.box h3{margin:0 0 10px;font-size:14px}
.chip{display:inline-block;background:#0c0e13;border:1px solid var(--border);border-radius:8px;padding:4px 9px;margin:3px;font-size:12px;font-family:ui-monospace,Consolas,monospace}
/* character */
.char-card{background:var(--panel2);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:18px}
.char-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.char-head .nm{font-size:19px;font-weight:800}
.char-head .meta{color:var(--muted);font-size:12px}
.char-head .sig{color:var(--amber);font-size:12px}
.ref-row{display:flex;align-items:center;gap:10px;margin:10px 0 4px;flex-wrap:wrap}
.ref-thumb{width:64px;height:88px;border-radius:8px;object-fit:cover;border:1px solid var(--border);background:
  repeating-conic-gradient(#2a2f3a 0% 25%,#1a1d24 0% 50%) 50%/16px 16px}
.ref-thumb.miss{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px;text-align:center}
.pose-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:10px}
.pose{cursor:pointer;background:var(--panel);border:1px solid var(--border);border-radius:10px;overflow:hidden;transition:.15s;position:relative}
.pose:hover{border-color:var(--accent);transform:translateY(-2px)}
.pose .thumb{width:100%;height:200px;object-fit:contain;background:
  repeating-conic-gradient(#232831 0% 25%,#1a1d24 0% 50%) 50%/20px 20px;display:block}
.pose .thumb.miss{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px}
.pose .cap{padding:8px 10px}
.pose .fn{font-family:ui-monospace,Consolas,monospace;font-size:12px;word-break:break-all}
.pose .st{position:absolute;top:8px;right:8px;font-size:11px;padding:2px 8px;border-radius:10px;font-weight:700}
.st.ok{background:rgba(63,185,80,.18);color:var(--green)}
.st.miss{background:rgba(248,81,73,.18);color:var(--red)}
.st.unused{background:rgba(210,153,34,.18);color:var(--amber)}
.pose .cnt{font-size:11px;color:var(--muted);margin-top:2px}
/* backgrounds */
.group-title{font-size:15px;font-weight:700;margin:18px 0 8px;padding-left:10px;border-left:3px solid var(--accent)}
.bg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.bg-card{cursor:pointer;background:var(--panel2);border:1px solid var(--border);border-radius:12px;overflow:hidden;transition:.15s}
.bg-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.bg-card .thumb{width:100%;height:120px;object-fit:cover;display:block;background:#0c0e13}
.bg-card .thumb.miss{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px}
.bg-card .cap{padding:9px 11px}
.bg-card .nm{font-weight:700;font-size:13px}
.bg-card .kk{font-family:ui-monospace,Consolas,monospace;font-size:11px;color:var(--muted)}
.bg-card .cnt{font-size:11px;color:var(--muted);margin-top:2px}
/* audio */
table{width:100%;border-collapse:collapse;background:var(--panel2);border:1px solid var(--border);border-radius:12px;overflow:hidden}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border);font-size:13px;vertical-align:top}
th{background:#0c0e13;color:var(--muted);font-weight:600;position:sticky;top:0}
tr:last-child td{border-bottom:none}
td.mono{font-family:ui-monospace,Consolas,monospace}
.req-no{color:var(--muted);font-size:11px}
/* controls */
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.controls input,.controls select{background:var(--panel);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:7px 10px;font-size:13px}
.controls input{min-width:200px}
/* lightbox */
.lb{position:fixed;inset:0;background:rgba(0,0,0,.82);display:none;align-items:center;justify-content:center;z-index:50;padding:24px}
.lb.show{display:flex}
.lb-inner{background:var(--panel);border:1px solid var(--border);border-radius:14px;max-width:860px;width:100%;max-height:90vh;overflow:auto;display:flex;flex-direction:column}
.lb-imgwrap{padding:18px;display:flex;justify-content:center;background:
  repeating-conic-gradient(#232831 0% 25%,#1a1d24 0% 50%) 50%/22px 22px}
.lb-img{max-width:100%;max-height:52vh;border-radius:8px}
.lb-audio{padding:30px;text-align:center;color:var(--muted)}
.lb-body{padding:16px 20px 22px}
.lb-body h2{margin:0 0 4px;font-size:18px}
.lb-body .fn{font-family:ui-monospace,Consolas,monospace;color:var(--accent);font-size:13px;word-break:break-all}
.lb-body .row{margin-top:12px}
.lb-body .lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.lb-body pre{background:#0c0e13;border:1px solid var(--border);border-radius:8px;padding:12px;white-space:pre-wrap;word-break:break-word;font-family:ui-monospace,Consolas,monospace;font-size:12px;margin:0;max-height:200px;overflow:auto}
.lb-close{position:absolute;top:14px;right:18px;font-size:26px;color:#fff;cursor:pointer;background:none;border:none}
.copy-btn{margin-top:8px;background:var(--blue);color:#fff;border:none;border-radius:8px;padding:7px 14px;cursor:pointer;font-size:12px;font-weight:600}
.copy-btn:active{transform:scale(.97)}
.tag{display:inline-block;font-size:11px;padding:2px 9px;border-radius:10px;font-weight:700;margin-left:6px}

.tag.miss{background:rgba(248,81,73,.18);color:var(--red)}
.tag.unused{background:rgba(210,153,34,.18);color:var(--amber)}

function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function statusOf(item){
  if(!item.has) return 'miss';
  if(item.usage===0) return 'unused';
  return 'ok';
}
function statBadge(item){
  const s=statusOf(item);
  if(s==='ok') return '<span class="st ok">已有·引用'+item.usage+'</span>';
  if(s==='unused') return '<span class="st unused">已有·未引用</span>';
  return '<span class="st miss">缺失</span>';
}

function statCard(title,big,note,pct){
  return '<div class="stat"><h3>'+esc(title)+'</h3><div class="big">'+esc(big)+'</div><div class="bar"><i style="width:'+pct+'%"></i></div><div class="note">'+esc(note)+'</div></div>';
}
// characters
let charFilter='', charStatus='all';
function renderChar(){
  let h='<div class="controls"><input id="c-search" placeholder="搜索 角色/pose/文件名…" oninput="charFilter=this.value.toLowerCase();renderChar()">'
    +'<select onchange="charStatus=this.value;renderChar()"><option value="all">全部状态</option><option value="ok">已有·已引用</option><option value="unused">已有·未引用</option><option value="miss">缺失</option></select></div>';
  DATA.characters.forEach(c=>{
    let poses=c.poses.filter(p=>{
      const hay=(c.name+' '+p.pose+' '+p.file+' '+p.expr).toLowerCase();
      if(charFilter && !hay.includes(charFilter)) return false;
      const st=statusOf(p);
      if(charStatus!=='all' && st!==charStatus) return false;
      return true;
    });
    if(charFilter && poses.length===0 && !c.name.toLowerCase().includes(charFilter)) return;
    h+='<div class="char-card">';
    h+='<div class="char-head"><div class="nm">'+esc(c.name)+'</div>'
      +'<div class="meta">id: <code>'+esc(c.id)+'</code></div>'
      +'<div class="sig">签名物：'+esc(c.signature)+'</div></div>';
    // ref
    h+='<div class="ref-row"><span style="color:var(--muted);font-size:12px">定调参考图（IP-Adapter 源，不入引擎）：</span>';
    if(c.ref_has) h+='<img class="ref-thumb" src="'+c.ref_src+'" title="'+esc(c.ref)+'">';
    else h+='<div class="ref-thumb miss">'+esc(c.ref)+'<br>缺失</div>';
    h+='<span class="mono" style="font-size:11px;color:var(--muted)">'+esc(c.ref)+'</span></div>';
    h+='<div class="pose-grid">';
    poses.forEach((p,idx)=>{
      h+='<div class="pose" onclick="openPose(\''+c.id+'\','+idx+')">'+statBadge(p);
      if(p.src) h+='<img class="thumb" src="'+p.src+'" loading="lazy">';
      else h+='<div class="thumb miss">图缺失<br>待生成</div>';
      h+='<div class="cap"><div class="fn">'+esc(p.file)+'</div><div class="cnt">pose: '+esc(p.pose)+' · 引用 '+p.usage+' 次</div></div></div>';
    });
    h+='</div></div>';
  });
  document.getElementById('p-char').innerHTML=h;
}
function openPose(cid,idx){
  const c=DATA.characters.find(x=>x.id===cid); const p=c.poses[idx];
  let body='<div class="lb-imgwrap">';
  if(p.src) body+='<img class="lb-img" src="'+p.src+'">';
  else body+='<div style="color:var(--muted);padding:40px">（图片尚未生成：'+esc(p.file)+'）</div>';
  body+='</div><div class="lb-body"><h2>'+esc(c.name)+' · '+esc(p.pose)+'<span class="tag '+(statusOf(p)==='ok'?'ok':statusOf(p))+'">'+(statusOf(p)==='ok'?'已有·引用'+p.usage:statusOf(p)==='unused'?'已有·未引用':'缺失')+'</span></h2>';
  body+='<div class="fn">'+esc(p.file)+'</div>';
  body+='<div class="row"><div class="lbl">身份固定块 identity</div><pre>'+esc(c.identity)+'</pre></div>';
  body+='<div class="row"><div class="lbl">表情追加词</div><pre>'+esc(p.expr)+'</pre></div>';
  body+='<div class="row"><div class="lbl">完整正向提示词（前缀S + identity + 表情）</div><pre id="pp">'+esc(p.positive)+'</pre><button class="copy-btn" onclick="copyTxt(\'pp\')">复制正向提示词</button></div>';
  body+='<div class="row"><div class="lbl">负向提示词（全局共用）</div><pre>'+esc(DATA.neg)+'</pre></div>';
  body+='<div class="row" style="color:var(--muted);font-size:12px">脚本引用次数：'+p.usage+'</div>';
  body+='</div>';
  showLb(body);
}

    +'<select onchange="bgStatus=this.value;renderBg()"><option value="all">全部状态</option><option value="ok">已有</option><option value="miss">缺失</option></select>';
  const groups=['必出','可选时段','风格重绘'];
  groups.forEach(g=>{
    if(bgGroup!=='all' && bgGroup!==g) return;
    const items=DATA.backgrounds.filter(b=>b.group===g && (bgStatus==='all'||(bgStatus==='ok'&&b.has)||(bgStatus==='miss'&&!b.has)));
    if(items.length===0) return;
    h+='<div class="group-title">'+esc(g)+'</div><div class="bg-grid">';
    items.forEach((b,idx)=>{
      h+='<div class="bg-card" onclick="openBg(\''+b.key+'\')">'+statBadge(b);

    h+='</div>';
  });

  const b=DATA.backgrounds.find(x=>x.key===key);
  let body='<div class="lb-imgwrap">';
  if(b.src) body+='<img class="lb-img" src="'+b.src+'">';
  else body+='<div style="color:var(--muted);padding:40px">（图片尚未生成：'+esc(b.file)+'）</div>';
  body+='</div><div class="lb-body"><h2>'+esc(b.name)+'<span class="tag '+(b.has?'ok':'miss')+'">'+(b.has?'已有·引用'+b.usage:'缺失')+'</span></h2>';
  body+='<div class="fn">'+esc(b.file)+' · 键位 <code>'+esc(b.key)+'</code> · 分组 '+esc(b.group)+'</div>';
  body+='<div class="row"><div class="lbl">使用 / 出现章节</div><pre>'+esc(b.usage_note)+'</pre></div>';
  body+='<div class="row"><div class="lbl">完整正向提示词（前缀P + specific）</div><pre id="pp">'+esc(b.positive)+'</pre><button class="copy-btn" onclick="copyTxt(\'pp\')">复制正向提示词</button></div>';
  body+='<div class="row"><div class="lbl">负向提示词（全局共用）</div><pre>'+esc(DATA.neg)+'</pre></div>';
  body+='<div class="row" style="color:var(--muted);font-size:12px">脚本引用次数：'+b.usage+'</div>';
  body+='</div>';
  showLb(body);
}
// audio
let auFilter='all';
function renderAudio(){
  let h='<div class="controls"><select onchange="auFilter=this.value;renderAudio()"><option value="all">全部</option><option value="req">仅必需</option><option value="opt">仅可选</option><option value="miss">仅缺失</option></select></div>';
  h+='<table><thead><tr><th>键位</th><th>类型</th><th>用途 / 出现章节</th><th>情绪</th><th>搜索关键词</th><th>状态</th><th>脚本引用</th></tr></thead><tbody>';
  DATA.audio.filter(a=>{
    if(auFilter==='req') return a.required;
    if(auFilter==='opt') return !a.required;
    if(auFilter==='miss') return !a.has;
    return true;
  }).forEach(a=>{
    const cls=a.has?'ok':'miss';
    const tag=a.has?'<span class="tag ok">已下载</span>':'<span class="tag miss">待下载</span>';
    const req=a.required?'':'<span class="req-no">（可选）</span>';
    h+='<tr><td class="mono">'+esc(a.key)+req+'</td><td>'+esc(a.type)+'</td><td>'+esc(a.usage)+'</td><td>'+esc(a.mood)+'</td><td>'+esc(a.kw)+'</td><td>'+tag+'</td><td>'+a.usage_count+'</td></tr>';
  });
  h+='</tbody></table>';
  h+='<div style="color:var(--muted);font-size:12px;margin-top:10px">下载后放入 <code>avg-engine/public/audio/</code>，文件名＝键位名（如 <code>bgm_morning.mp3</code>），并在 story3/manifest.ts 的 audio 字段登记。注意：清单若列了缺失文件，loadAudio 会因 404 抛错导致游戏启动崩溃，故未下载前 manifest 必须留空。</div>';
  document.getElementById('p-audio').innerHTML=h;
}
// lightbox
function showLb(html){document.getElementById('lb-content').innerHTML=html;document.getElementById('lb').classList.add('show');}
function closeLb(){document.getElementById('lb').classList.remove('show');}
document.getElementById('lb').onclick=e=>{if(e.target.id==='lb')closeLb();};
function copyTxt(id){const t=document.getElementById(id).textContent;navigator.clipboard.writeText(t).then(()=>{alert('已复制提示词');});}
// init
renderOverview();renderChar();renderBg();renderAudio();
document.getElementById('t-char').textContent=SUMMARY.pose_has+'/'+SUMMARY.pose_total;
document.getElementById('t-bg').textContent=SUMMARY.bg_has+'/'+SUMMARY.bg_total;
document.getElementById('t-audio').textContent=SUMMARY.au_has+'/'+SUMMARY.au_req;
</script>
