<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10161f"/>
      <stop offset="0.55" stop-color="#0c1119"/>
      <stop offset="1" stop-color="#070b11"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#1d2c3e" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0a0f16" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0 H0 V64" fill="none" stroke="#1b2a3a" stroke-width="1" opacity="0.5"/>
    </pattern>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#grid)"/>
  <rect width="1280" height="720" fill="url(#glow)"/>
  <!-- 远景楼宇剪影 -->
  <g fill="#0e151e" opacity="0.85">
    <rect x="80" y="240" width="150" height="320"/>
    <rect x="250" y="180" width="120" height="380"/>
    <rect x="940" y="200" width="140" height="360"/>
    <rect x="1100" y="260" width="130" height="300"/>
  </g>
  <!-- 冷色窗格微光 -->
  <g fill="#274055" opacity="0.55">
    <rect x="100" y="270" width="18" height="26"/>
    <rect x="140" y="270" width="18" height="26"/>
    <rect x="100" y="320" width="18" height="26"/>
    <rect x="140" y="320" width="18" height="26"/>
    <rect x="270" y="220" width="16" height="24"/>
    <rect x="310" y="220" width="16" height="24"/>
    <rect x="270" y="270" width="16" height="24"/>
    <rect x="310" y="270" width="16" height="24"/>
    <rect x="960" y="240" width="18" height="26"/>
    <rect x="1000" y="240" width="18" height="26"/>
    <rect x="960" y="300" width="18" height="26"/>
    <rect x="1000" y="300" width="18" height="26"/>
    <rect x="1120" y="300" width="18" height="26"/>
    <rect x="1160" y="300" width="18" height="26"/>
  </g>
  <!-- 地面 -->
  <rect x="0" y="560" width="1280" height="160" fill="#0a0f16"/>
  <line x1="0" y1="560" x2="1280" y2="560" stroke="#22364a" stroke-width="2" opacity="0.7"/>
  <!-- 道路透视 -->
  <path d="M520 560 L760 560 L1080 720 L200 720 Z" fill="#0c131c" opacity="0.8"/>
  <path d="M610 560 L670 560 L720 720 L560 720 Z" fill="#0e1620" opacity="0.7"/>
  <!-- 飘动微尘 -->
  <g fill="#9fc3e0" opacity="0.18">
    <circle cx="300" cy="160" r="2"/>
    <circle cx="520" cy="120" r="1.5"/>
    <circle cx="780" cy="180" r="2"/>
    <circle cx="980" cy="140" r="1.5"/>
    <circle cx="640" cy="240" r="1.5"/>
  </g>
</svg>
