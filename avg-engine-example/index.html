<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AVG 冒险游戏引擎</title>
  <link rel="stylesheet" href="/src/styles/main.css" />
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas"></canvas>
    <div id="ui-layer">
      <!-- 首页菜单 -->
      <div id="title-menu" class="hidden">
        <div class="title-menu-inner">
          <button id="btn-title-start" class="title-menu-btn">
            <span class="btn-label">开始游戏</span>
            <span class="btn-sub">NEW GAME</span>
          </button>
          <button id="btn-title-continue" class="title-menu-btn hidden">
            <span class="btn-label">继续游戏</span>
            <span class="btn-sub">CONTINUE</span>
          </button>
          <button id="btn-title-settings" class="title-menu-btn">
            <span class="btn-label">游戏设置</span>
            <span class="btn-sub">SETTINGS</span>
          </button>
          <button id="btn-title-quit" class="title-menu-btn">
            <span class="btn-label">选择故事</span>
            <span class="btn-sub">STORIES</span>
          </button>
          <button id="btn-title-gallery" class="title-menu-btn">
            <span class="btn-label">结局收集</span>
            <span class="btn-sub">GALLERY</span>
          </button>
        </div>
      </div>
      <!-- 对话框 -->
      <div id="dialog-box" class="hidden">
        <div id="speaker-name"></div>
        <div id="dialog-text"></div>
        <div id="click-indicator">▼</div>
      </div>
      <!-- 选项面板 -->
      <div id="choice-panel" class="hidden"></div>
      <!-- 顶部控制栏 -->
      <div id="top-bar">
        <button id="btn-auto" title="自动播放">自动</button>
        <button id="btn-skip" title="快进">快进</button>
        <button id="btn-save" title="存档">存档</button>
        <button id="btn-load" title="读档">读档</button>
        <button id="btn-settings" title="设置">设置</button>
        <button id="btn-backlog" title="历史">历史</button>
        <button id="btn-relations" title="角色关系">关系</button>
        <button id="btn-clues" title="线索笔记本">线索<span id="clues-badge" class="badge hidden">0</span></button>
        <button id="btn-codex" title="世界观图鉴">图鉴<span id="codex-badge" class="badge hidden">0</span></button>
      </div>
      <!-- 存档面板 -->
      <div id="save-load-panel" class="hidden">
        <div class="panel-header">
          <h2 id="save-load-title">存档</h2>
          <button id="btn-save-load-close">✕</button>
        </div>
        <div class="panel-tabs">
          <button class="tab active" data-tab="save">存档</button>
          <button class="tab" data-tab="load">读档</button>
        </div>
        <div id="save-slots" class="slot-list"></div>
      </div>
      <!-- 设置面板 -->
      <div id="settings-panel" class="hidden">
        <div class="panel-header">
          <h2>设置</h2>
          <button id="btn-settings-close">✕</button>
        </div>
        <div class="settings-content">
          <div class="setting-row">
            <label>文字速度</label>
            <input type="range" id="setting-text-speed" min="1" max="10" value="5" />
          </div>
          <div class="setting-row">
            <label>自动播放间隔</label>
            <input type="range" id="setting-auto-delay" min="1" max="10" value="5" />
          </div>
          <div class="setting-row">
            <label>BGM音量</label>
            <input type="range" id="setting-bgm-volume" min="0" max="100" value="70" />
          </div>
          <div class="setting-row">
            <label>音效音量</label>
            <input type="range" id="setting-se-volume" min="0" max="100" value="80" />
          </div>
          <div class="setting-row">
            <label>文字大小</label>
            <select id="setting-font-size">
              <option value="small">小</option>
              <option value="medium" selected>中</option>
              <option value="large">大</option>
            </select>
          </div>
          <div class="setting-row">
            <label>快速反应事件 (QTE)</label>
            <input type="checkbox" id="setting-qte-enabled" checked />
          </div>
        </div>
      </div>
      <!-- 故事选择面板 -->
      <div id="story-select-panel" class="hidden">
        <div class="panel-header">
          <h2>选择故事</h2>
          <button id="btn-story-select-close">✕</button>
        </div>
        <div id="story-list" class="story-list"></div>
      </div>
      <!-- 结局收集相册面板 -->
      <div id="ending-gallery-panel" class="hidden">
        <div class="panel-header">
          <h2>结局收集</h2>
          <button id="btn-gallery-close">✕</button>
        </div>
        <div id="ending-gallery-grid" class="ending-grid"></div>
      </div>
      <!-- 结局详情浮层 -->
      <div id="ending-detail-modal" class="hidden">
        <div id="ending-detail-body"></div>
      </div>
      <!-- 结局抵达提示浮层 -->
      <div id="ending-modal" class="hidden">
        <div class="ending-modal-card">
          <div class="ending-modal-badge">🎉 通关</div>
          <h2 id="ending-modal-title">剧终</h2>
          <p id="ending-modal-body"></p>
          <div class="ending-modal-actions">
            <button id="btn-ending-gallery" class="title-menu-btn">
              <span class="btn-label">查看结局收集</span>
            </button>
            <button id="btn-ending-title" class="title-menu-btn primary">
              <span class="btn-label">返回标题</span>
            </button>
          </div>
        </div>
      </div>
      <!-- 对话历史 -->
      <div id="backlog-panel" class="hidden">
        <div class="panel-header">
          <h2>对话历史</h2>
          <button id="btn-backlog-close">✕</button>
        </div>
        <div id="backlog-content"></div>
      </div>
      <!-- 角色关系面板（阶段1：人物养成） -->
      <div id="relations-panel" class="hidden">
        <div class="panel-header">
          <h2>角色关系</h2>
          <button id="btn-relations-close">✕</button>
        </div>
        <div id="relations-content" class="relations-content"></div>
      </div>
      <!-- 线索笔记本 + 推理板（阶段2） -->
      <div id="clues-panel" class="hidden">
        <div class="panel-header">
          <h2>线索笔记本</h2>
          <button id="btn-clues-close">✕</button>
        </div>
        <div id="clues-content" class="clues-content"></div>
        <div class="clues-footer" id="clues-footer">
          <button id="btn-clues-use" class="primary">使用</button>
        </div>
        <div id="clues-hint" class="clues-hint hidden"></div>
      </div>
      <!-- 线索详情浮层（点击卡片放大查看） -->
      <div id="clue-detail-modal" class="hidden">
        <div id="clue-detail-card">
          <button id="btn-clue-detail-close" class="clue-detail-close" title="关闭">✕</button>
          <img id="clue-detail-img" class="clue-detail-img" src="" alt="" />
          <h3 id="clue-detail-name" class="clue-detail-name"></h3>
          <p id="clue-detail-desc" class="clue-detail-desc"></p>
        </div>
      </div>
      <!-- 养成事件 / 推理触发提示（阶段1/2 共用） -->
      <div id="event-toast" class="hidden"></div>
      <!-- 阶段3：探索模式 HUD（拖拽平移 + 点击热区 + 退出） -->
      <div id="explore-hud" class="hidden">
        <div id="explore-hint" class="explore-hint">
          <span id="explore-hint-text"></span>
          <button id="btn-explore-end" class="explore-end-link" title="退出探索">结束探索 ✕</button>
        </div>
        <button id="btn-explore-arrow-left" class="explore-arrow explore-arrow-left" title="向左看">‹</button>
        <button id="btn-explore-arrow-right" class="explore-arrow explore-arrow-right" title="向右看">›</button>
      </div>
      <!-- 阶段5：电影宽银幕黑边（上下黑条） -->
      <div id="cinematic-bars" class="hidden">
        <div class="cb-top"></div>
        <div class="cb-bottom"></div>
      </div>
      <!-- 阶段5：探索拾取金色光环 -->
      <div id="pickup-flash" class="hidden"></div>
      <!-- 阶段4：场景自选枢纽覆盖层（节点地图 + 时间/行动点） -->
      <div id="hub-overlay" class="hidden">
        <div id="hub-panel">
          <div id="hub-header">
            <div id="hub-title"></div>
            <div id="hub-status">
              <span id="hub-time-phase"></span>
              <span id="hub-ap"></span>
            </div>
          </div>
          <div id="hub-grid"></div>
          <div id="hub-footer">
            <button id="btn-hub-end-day">结束今天</button>
          </div>
        </div>
        <div id="hub-locked-toast" class="hidden"></div>
      </div>
      <!-- 阶段6：QTE 快速反应覆盖层（限时点击/按键/连点） -->
      <div id="qte-overlay" class="hidden">
        <div id="qte-ring-wrap">
          <svg id="qte-ring" viewBox="0 0 120 120">
            <circle id="qte-ring-bg" cx="60" cy="60" r="54" />
            <circle id="qte-ring-fg" cx="60" cy="60" r="54" />
          </svg>
          <div id="qte-time-label"></div>
        </div>
        <div id="qte-prompt"></div>
        <div id="qte-instruction"></div>
        <div id="qte-mash-wrap" class="hidden">
          <div id="qte-mash-track"><div id="qte-mash-fill"></div></div>
          <div id="qte-mash-count"></div>
        </div>
      </div>
      <!-- 阶段6：世界观图鉴面板（Codex） -->
      <div id="codex-panel" class="hidden">
        <div class="panel-header">
          <h2>世界观图鉴</h2>
          <button id="btn-codex-close">✕</button>
        </div>
        <div id="codex-tabs" class="codex-tabs"></div>
        <div id="codex-content" class="codex-content"></div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
